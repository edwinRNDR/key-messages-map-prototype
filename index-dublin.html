<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Key Message Map Prototype</title>
    <link href="https://cdn.jsdelivr.net/gh/tofsjonas/sortable@latest/sortable-base.min.css" rel="stylesheet" />

    <style>
        :root {
            --color-project: #E45C4D;
            --color-partner: #008475;
            --color-article: #1C85FF;
            --color-article-keyword: #AED3FF;
            --color-project-keyword: #F58296;

            --color-cause-effect: #F5D475;
            --color-chemical: #E0C7F5;
            --color-condition: #31D9C4;

        hr {
            border-top: 1px solid white;
        }
        @font-face {
            font-family: 'Satoshi-Regular';
            src: url('fonts/Satoshi-Regular.woff2') format('woff2'),
            url('fonts/Satoshi-Regular.woff') format('woff'),
            url('fonts/Satoshi-Regular.ttf') format('truetype');
            font-weight: 400;
            font-display: swap;
            font-style: normal;
        }

        @font-face {
            font-family: 'Satoshi-Italic';
            src: url('fonts/Satoshi-Italic.woff2') format('woff2'),
            url('fonts/Satoshi-Italic.woff') format('woff'),
            url('fonts/Satoshi-Italic.ttf') format('truetype');
            font-weight: 400;
            font-display: swap;
            font-style: italic;
        }

        @font-face {
            font-family: 'Satoshi-Medium';

            url('fonts/Satoshi-Medium.woff') format('woff'),
            url('fonts/Satoshi-Medium.ttf') format('truetype');

        body {
            font-family: 'Satoshi-Regular', sans-serif;

        }

        .type-project {
            color: var(--color-project);

        }

        .type-article-keyword {

        }

            text-decoration-color: var(--color-project-keyword);
        }

        .type-project-topic {

        }

        .type-project-topic-bg {

            color: white !important;
        }

        .type-project-keyword-bg {
            background-color: var(--color-project-keyword) !important;
            color: white !important;
        }

        .type-partner-bg {
            background-color: var(--color-partner) !important;
            color: white !important;
        }
        .type-cause-effect-bg {
            background-color: var(--color-cause-effect) !important;

        .type-chemical-bg {

        #node-box {
            font-family: 'Satoshi-Regular', sans-serif;
            position: fixed;

            width: 450px;

        .node-box-scroll {
            flex-grow: 1;

        .node-card {
            flex-grow: 0;
            background-color: rgba(245, 245, 245, 1.0);
            border-radius: 5px;

            img {

            h1 {

            p {

            }

        }

        .numeric {

        }

        .adjacent {

        }

        .adjacent:hover {
            cursor: pointer;

        .graph-hover {

        }

        #info-box {
            position: fixed;

            border-radius: 5px;
            z-index: 1000;

            display: flex;

        }

        #info-box h3 {

    </style>

<body>
<div id="node-box">
</div>

<div id="info-box">
    <div class="legend-item" id="legend-article">
        <span class="type-article">●</span>
        <div class="legend-label">Article</div>
    </div>
    <div class="legend-item" id="legend-article-keyword">
        <span class="type-article-keyword">●</span>
        <div class="legend-label">Article keyword</div>
    </div>

    <div class="legend-item" id="legend-project">
        <span class="type-project">●</span>
        <div class="legend-label">Project</div>
    </div>

    <div class="legend-item" id="legend-project-topic">
        <span class="type-project-topic">●</span>
        <div class="legend-label">Project Topic</div>
    </div>

    <div class="legend-item" id="legend-project-keyword">
        <span class="type-project-keyword">●</span>
        <div class="legend-label">Project Keyword</div>
    </div>

    <div class="legend-item" id="legend-partner">
        <span class="type-partner">●</span>
        <div class="legend-label">Partner</div>
    </div>

    <div class="legend-item" id="legend-cause-effect">
        <span class="type-cause-effect">●</span>
        <div class="legend-label">Cause-effect</div>
    </div>
    <div class="legend-item" id="legend-chemical">
        <span class="type-chemical">●</span>
        <div class="legend-label">Chemical</div>
    </div>
    <div class="legend-item" id="legend-condition">
        <span class="type-condition">●</span>
        <div class="legend-label">Condition</div>
    </div>

</div>
<div id="graph"></div>

<script type="module">
    import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";
    import {forceCollide} from 'https://esm.sh/d3-force';
    import ForceGraph from "https://cdn.jsdelivr.net/npm/force-graph@1.49.5/+esm"
    import {data} from "./data.js";
    import {edges} from "./edges.js";
    import {
        minimumSpanningTree,
        minimumSpanningTreeFromSubtree,
        findEdgesThroughNode,
        findAdjacentSubtree,
        findAdjacentNodes,
        countAdjacentNodes
    } from "./dijkstra.js";

    const chemicals = ['PFAS', 'Plastics', 'Phthalates', 'Bisphenol', 'Arsenic'].map(chemical => ({
        id: chemical,
        type: 'chemical',
        name: chemical
    }))
    const conditions = ['cancer', 'death', 'obesity', 'Metabolic disorder'].map(condition => ({
        id: condition,
        type: 'condition',
        name: condition
    }))

    const causeEffect = [
        'PFAS-cancer',
        'PFAS-death',
        'Plastics-death',
        'Phthalates-obesity',
        'Bisphenol-obesity',
        'Arsenic-Metabolic disorder'
    ].map(ca => ({id: ca, type: 'cause-effect', name: ca.split('-')[0] + ' causes ' + ca.split('-')[1]}))


    const causeEffectToCause = causeEffect.map(ce => ({
        source: ce.id,
        target: ce.id.split('-')[0],
        type: 'cause-effect_cause'
    }))
    const causeEffectToEffect = causeEffect.map(ce => ({
        source: ce.id,
        target: ce.id.split('-')[1],
        type: 'cause-effect_effect'
    }))

    for (const item of data) {
        if (!item.type) {
            item.type = 'article'
        }
    }

    // Select random articles and link them to random causeEffect
    const articleNodes = data.filter(node => node.type === 'article');

    const articleKeywords = new Map()

    for (const article of articleNodes) {
        const keywords = article.keywords.split(',').map(keyword => keyword.trim())
        for (const keyword of keywords) {
            if (!articleKeywords.has(keyword)) {
                articleKeywords.set(keyword, [])
            }
            articleKeywords.get(keyword).push(article)
        }
    }

    // Remove entries with fewer than 5 article
    for (const [keyword, articles] of articleKeywords.entries()) {
        if (articles.length < 5) {
            articleKeywords.delete(keyword)
        }
    }

    // Remove entries with very short keywords
    for (const [keyword, articles] of articleKeywords.entries()) {
        if (!keyword|| keyword.length < 2 ) {
            articleKeywords.delete(keyword)
        }
    }

    const articleKeywordNodes = Array.from(articleKeywords.entries()).map(([keyword, articles]) => ({
        id: `article-keyword-${keyword}`,
        type: 'article-keyword',
        name: keyword,
        label: keyword,
    }))

    const articleKeywordLinks = Array.from(articleKeywords.entries()).flatMap(([keyword, articles]) => articles.map(article => ({
        source: article.id,
        target: `article-keyword-${keyword}`,
        type: 'article_article-keyword'
    })))
    const numArticlesToLink = articleNodes.length
    const articleLinks = [];

    for (let i = 0; i < numArticlesToLink; i++) {
        const randomArticle = articleNodes[i];
        const randomCauseEffect = causeEffect[Math.floor(Math.random() * causeEffect.length)];
        articleLinks.push({
            source: randomArticle.id,
            target: randomCauseEffect.id,
            type: 'article_cause-effect'
        });
    }

    const partnerNodes = data.filter(node => node.type === 'partner');
    const countryNames = new Set()
    for (const partner of partnerNodes) {
        if (partner.country) {
            countryNames.add(partner.country)
        }
    }
    const countryNodes = [...countryNames].map(country => ({
        name: country,
        id: "country-" + country,
        type: "country"
    }))

    const countryLinks = partnerNodes.map( partner => (
        {
            source: partner.id,
            target: `country-${partner.country||'Netherlands'}`,
            type: 'partner_country'
        }
    ) )

    console.log('Country nodes:', countryNodes)
    console.log('Country links:', countryLinks)
    
    const gData = {
        nodes: [...data, ...chemicals, ...conditions, ...causeEffect, ...articleKeywordNodes, ...countryNodes],
        links: [...edges, ...articleLinks, ...causeEffectToCause, ...causeEffectToEffect, ...articleKeywordLinks, ...countryLinks]
    };

    // Find duplicate IDs
    const idMap = new Map();
    const duplicates = [];
    for (const node of gData.nodes) {
        if (idMap.has(node.id)) {
            duplicates.push({id: node.id, first: idMap.get(node.id), duplicate: node});
        } else {
            idMap.set(node.id, node);
        }
    }

    if (duplicates.length > 0) {
        console.log('Duplicate IDs found:');
        for (const dup of duplicates) {
            console.log(`ID: ${dup.id}`);
            console.log('First occurrence:', dup.first);
            console.log('Duplicate occurrence:', dup.duplicate);
        }
    } else {
        console.log('No duplicate IDs found');
    }

    countAdjacentNodes(gData.nodes, gData.links)

    for (const node of data) {
        if (!node.name) {
            console.log(`Node without name found: ${node.id}`)
        }
        if (node.type === 'partner' && !node.fullname) {
            console.log(`Partner node without fullname found: ${node.name}`)
        }
    }

    let hoverNode = null
    let selectedNodeId = null
    let selectedNode = null

    let centerAtTimeout = null

    let storedEdgesColors = null

    const Graph = new ForceGraph()
    (document.getElementById('graph'))
        .autoPauseRedraw(false)
        .onNodeClick((node, event) => {
            selectNode(node)
        })
        .onNodeHover((node, event) => {
            hoverNode = node

            if (storedEdgesColors == null) {
                storedEdgesColors = Graph.graphData().links.map(edge => edge.color)
            } else {
                let index = 0
                for (const edge of Graph.graphData().links) {
                    edge.color = storedEdgesColors[index]
                    index++
                }
            }
            for (const edge of findEdgesThroughNode(Graph.graphData().links, node)) {
                edge.color = 'rgba(0, 0, 0, 0.2)'
            }
        })

        .nodeCanvasObject((node, ctx, globalScale) => nodePaint(node, ctx, globalScale))
        .onRenderFramePre((ctx, globalScale) => {
            if (selectedNode != null && selectedNode.x != null && selectedNode.y != null) {
                ctx.save()
                const x = selectedNode.x
                const y = selectedNode.y
                const gradient = ctx.createRadialGradient(x, y, 0, x, y, 600);


                const steps = 7
                for (let i = 0; i < steps; ++i) {

                    const opacity = 0.25 * (steps - 1 - i) / (steps - 1)
                    gradient.addColorStop(i / steps, nodeColor(selectedNode, opacity));
                    gradient.addColorStop((i + 1) / steps, nodeColor(selectedNode, opacity));
                }

                gradient.addColorStop(0.9, nodeColor(selectedNode, 0.0));
                ctx.fillStyle = gradient;
                ctx.beginPath()
                ctx.arc(x, y, 600.0, 0, 2 * Math.PI, false)
                ctx.fill()

                const gradient2 = ctx.createRadialGradient(x, y, 0, x, y, 30);

// Add three color stops
                gradient2.addColorStop(0, nodeColor(selectedNode, 0.5));
                gradient2.addColorStop(1.0, nodeColor(selectedNode, 0.0));
                ctx.fillStyle = gradient2;
                ctx.beginPath()
                ctx.arc(x, y, 30.0, 0, 2 * Math.PI, false)
                ctx.fill()


                ctx.restore()
            }
        })

        .graphData(gData)
        .d3Force('collide', forceCollide(node => (node.id === selectedNodeId)? 150.0 :  (node.type === 'project-keyword' || node.type === 'project-topic') ? 15.0 : 5.0))

    function nodeColor(node, opacity = 1.0) {
        if (node.type === 'article') {
            return `rgba(28, 133, 255, ${opacity})`;
        } else if (node.type === 'article-keyword') {
            return `rgba(174, 211, 255, ${opacity})`;
        } else if (node.type === 'project') {
            return `rgba(228, 92, 77, ${opacity})`;
        } else if (node.type === 'partner') {
            return `rgba(0, 132, 117, ${opacity})`;
        } else if (node.type === 'project-topic') {
            return `rgba(210, 26, 70, ${opacity})`;
        } else if (node.type === 'project-keyword') {
            return `rgba(245, 130, 150, ${opacity})`;
        } else if (node.type === 'chemical') {
            return `rgba(224, 119, 245, ${opacity})`;
        } else if (node.type === 'condition') {
            return `rgba(49, 217, 196, ${opacity})`;
        } else if (node.type === 'cause-effect') {
            return `rgba(245, 212, 117, ${opacity})`;
        } else {
            return `rgba(0, 0, 0, ${opacity})`;
        }
    }

    function nodePaint({id, type, x, y, name, count}, ctx, globalScale) {
        ctx.fillStyle = nodeColor({'type': type})

        ctx.beginPath()
        var radius = 5.0;
        if (type === 'project-keyword' || type === 'project-topic' || type === 'article-keyword') {
            radius = 10.0;
        }
        if (id === selectedNodeId) {
            radius = 100.0;
        }
        ctx.arc(x, y, radius, 0, 2 * Math.PI, false)
        ctx.fill()

        if (id === hoverNode?.id) {
            ctx.beginPath()
            ctx.arc(x, y, radius * 2, 0, 2 * Math.PI, false)
            ctx.stroke()
        }

        //
        if (type === 'project-keyword' || type === 'project-topic' || type === 'article-keyword' || type==='country'
            || id === selectedNode?.id

        ) {
            const label = name || '';
            const fontSize = 12 / globalScale;
            ctx.font = `${fontSize}px Satoshi-Regular`;
            const textWidth = ctx.measureText(label).width;

            if (textWidth/globalScale < 8.0 * radius / globalScale) {
                const bckgDimensions = [textWidth, fontSize].map(n => n + fontSize * 0.2); // some padding

                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                // ctx.fillRect(x - bckgDimensions[0] / 2, y - bckgDimensions[1] / 2, ...bckgDimensions);

                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = 'black'
                if (id === selectedNode?.id) {
                    ctx.fillText(label, x, y + 20.0/globalScale);
                } else {
                    ctx.fillText(label, x, y + radius + 5.0/globalScale);
                }
            }

        }

        const valence = count?.get('total') || 0
        const logValence = Math.log(valence + 1)
        if (globalScale > 3.0 - logValence * 0.25 || id === selectedNode?.id || id === hoverNode?.id) {
            const label = valence > 0 ? valence : '';
            const fontSize = 12 / globalScale;
            ctx.font = `${fontSize}px Satoshi-Regular`;
            const textWidth = ctx.measureText(label).width;
            const bckgDimensions = [textWidth, fontSize].map(n => n + fontSize * 0.2); // some padding

            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = 'white'

            ctx.fillText(label, x, y);
        }
    }

    Graph.focusAt = function(node) {
        if (centerAtTimeout) {
            clearTimeout(centerAtTimeout)
            centerAtTimeout = null
        }

        centerAtTimeout = setTimeout(() => {
            const axis = Math.min(Graph.width()-450.0, Graph.height())
            const zoomFactor = axis / 1200.0
            Graph.zoom(zoomFactor, 1000)
            const x = node.x - 450.0 /  zoomFactor * 0.5
            Graph.centerAt(x, node.y, 1000)
        }, 600)
    }

    document.getElementById('legend-article').addEventListener('click', () => {
        storedEdgesColors = null
        const items = gData.nodes.filter(node => node.type === 'article')
        const hub = {"id": "hub", "type": "article", "name": "All articles"}
        const hubLinks = items.map(article => ({source: article.id, target: hub.id, weight: 1.0}))
        const edges = gData.links.concat(hubLinks)
        const mst = minimumSpanningTreeFromSubtree(edges, hubLinks)

        const toAddLinks0 = gData.links.filter( edge => edge.type === 'article_article-keyword')
        const toAddLinks1 = gData.links.filter( edge => edge.type === 'article_project')
        const toAddLinks = toAddLinks0.concat(toAddLinks1)
        const newLinks = mst.mstEdges.concat(toAddLinks)


        Graph.graphData({nodes: gData.nodes.concat(hub), links: newLinks})
        selectedNode = hub
        selectedNodeId = hub.id

        for (const edge of Graph.graphData().links) {
            edge.color = 'rgba(255, 255, 255, 0.1)'
        }

        for (const edge of findEdgesThroughNode(Graph.graphData().links, hub.id)) {
            edge.color = 'rgba(255, 255, 255, 0.5)'
        }

        Graph.focusAt(hub)

        populateNodeBox(hub, items)
    })
    document.getElementById('legend-project-topic').addEventListener('click', () => {
        storedEdgesColors = null
        const items = gData.nodes.filter(node => node.type === 'project-topic')
        const hub = {"id": "hub", "type": "project-topic", "name": "All project topics"}
        const hubLinks = items.map(item => ({source: item.id, target: hub.id, weight: 1.0}))
        const edges = gData.links.concat(hubLinks)
        const mst = minimumSpanningTreeFromSubtree(edges, hubLinks)
        Graph.graphData({nodes: gData.nodes.concat(hub), links: mst.mstEdges})
        selectedNode = hub
        selectedNodeId = hub.id

        for (const edge of Graph.graphData().links) {
            edge.color = 'rgba(255, 255, 255, 0.1)'
        }

        for (const edge of findEdgesThroughNode(Graph.graphData().links, hub.id)) {
            edge.color = 'rgba(255, 255, 255, 0.5)'
        }
        Graph.focusAt(hub)
        populateNodeBox(hub, items)
    })
    document.getElementById('legend-project').addEventListener('click', () => {
        storedEdgesColors = null
        const items = gData.nodes.filter(node => node.type === 'project')
        const hub = {"id": "hub", "type": "project", "name": "All projects"}
        const hubLinks = items.map(item => ({source: item.id, target: hub.id, weight: 1.0}))
        const edges = gData.links.concat(hubLinks)
        const mst = minimumSpanningTreeFromSubtree(edges, hubLinks)

        const toAddLinks = gData.links.filter( edge => edge.type === 'project-topic_project')
        const newLinks = mst.mstEdges.concat(toAddLinks)



        Graph.graphData({nodes: gData.nodes.concat(hub), links: newLinks})
        selectedNode = hub
        selectedNodeId = hub.id

        for (const edge of Graph.graphData().links) {
            edge.color = 'rgba(255, 255, 255, 0.5)'
        }

        for (const edge of findEdgesThroughNode(Graph.graphData().links, hub.id)) {
            edge.color = 'rgba(255, 255, 255, 0.5)'
        }
        Graph.focusAt(hub)
        populateNodeBox(hub, items)
    })
    document.getElementById('legend-partner').addEventListener('click', () => {
        storedEdgesColors = null
        const items = gData.nodes.filter(node => node.type === 'partner')
        const hub = {"id": "hub", "type": "partner", "name": "All partners"}
        const hubLinks = items.map(item => ({source: item.id, target: hub.id, weight: 1.0}))
        const edges = gData.links.concat(hubLinks)
        const mst = minimumSpanningTreeFromSubtree(edges, hubLinks)

        const toAddLinks = gData.links.filter( edge => edge.type === 'partner_country')
        const newLinks = mst.mstEdges.concat(toAddLinks)

        Graph.graphData({nodes: gData.nodes.concat(hub), links: newLinks})
        selectedNode = hub
        selectedNodeId = hub.id

        console.log(toAddLinks)


        for (const edge of Graph.graphData().links) {
            edge.color = 'rgba(255, 255, 255, 0.25)'
        }

        for (const edge of findEdgesThroughNode(Graph.graphData().links, hub.id)) {
            edge.color = 'rgba(255, 255, 255, 0.5)'
        }
        Graph.focusAt(hub)
        populateNodeBox(hub, items)
    })
    document.getElementById('legend-project-keyword').addEventListener('click', () => {
        storedEdgesColors = null
        const items = gData.nodes.filter(node => node.type === 'project-keyword')
        const hub = {"id": "hub", "type": "project-keyword", "name": "All project keywords"}

    function selectNode(node) {
        storedEdgesColors = null

        selectedNodeId = node.id
        selectedNode = node
        const adjacent = findAdjacentSubtree(gData.links, node.id)
        const adjacentNodes = findAdjacentNodes(gData.links, node.id)
        const newEdges = minimumSpanningTreeFromSubtree(gData.links, adjacent)
        Graph.graphData({nodes: gData.nodes, links: newEdges.mstEdges})

        for (const edge of newEdges.mstEdges) {
            edge.color = 'rgba(255, 255, 255, 0.1)'
        }

        for (const edge of findEdgesThroughNode(Graph.graphData().links, node.id)) {
            edge.color = 'rgba(255, 255, 255, 0.5)'
        }

        for (const node of gData.nodes) {
            delete node.fx;
            delete node.fy;
        }
        node.fx = node.x;
        node.fy = node.y;
        node.radius = 100.0;
        populateNodeBox(node, [...adjacentNodes])
        Graph.focusAt(node)
    }

    function populateNodeBox(node, adjacent = []) {

</tr>`).join('')}
    </table>
</div>
`

            summaryCard = `<div class="node-card type-project">

<p>${node.description}</p>
</div>`
        } else if (node.type === 'article' && node.authors) {

<img src="${node.image}" alt="article cover art"/>
<p>${node["date-of-publication"]}</p>

        } else if (node.type === 'project-topic' && node.description) {
            summaryCard = `<div class="node-card type-project-topic">

</div>`
        } else if (node.type === 'project-keyword' && node.description) {
            summaryCard = `<div class="node-card type-project-keyword">
<h3>Summary</h3>
<p>${node["description"]}</p>

</thead>

    </tr>`).join('')}
    </table>
</div>
`

<hr/>

`


        document.getElementById('node-box').innerHTML = `
<div class="node-card type-${node.type}-bg">

<div class="node-box-scroll">

${projectTopicsCard}
${causeEffectsCard}
${chemicalsCard}
${conditionsCard}
${projectsCard}
${articlesCard}
${partnersCard}
</div>
`
        for (const node of adjacent) {
            document.getElementById(`adjacent-${node.id}`).addEventListener('click', () => {
                selectNode(node)
            })
            document.getElementById(`adjacent-${node.id}`).addEventListener('mousemove', () => {
                const g = Graph.graphData()
                const target = g.nodes.find(n => n.id === node.id)
                Graph.focusAt(target)

    }
